<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#682339">
<meta name="panel-build" content="1.4.0">
<title>Хтонград — писательская мастерская</title>
<link rel="manifest" href="./manifest.webmanifest?v=1.4.0">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css?v=1.4.0">
</head>
<body>
<div class="panel">
<header class="bar"><a href="#overview" class="brand"><span class="panel-mark" aria-hidden="true">02</span>Хтонград</a><button type="button" class="icon-button" data-action="menu" aria-label="Настройки и копии данных" aria-haspopup="dialog">⋯</button></header>
<main id="main"></main>
<div class="bottom">
<button type="button" id="create" class="create" aria-label="Создать запись" hidden>+</button>
<nav aria-label="Разделы панели" id="nav"></nav>
</div>
</div>
<dialog id="sheet" aria-labelledby="sheet-title"><div class="row sheet-head"><h2 id="sheet-title"></h2><button data-action="close">Закрыть</button></div><div id="sheet-body"></div></dialog>
<p id="toast" role="status" hidden></p>
<script src="./google-sync.js?v=1.4.0" defer></script>
<script type="module" src="./app.js?v=1.4.0"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).catch(error=>{
    console.warn('Не удалось подготовить запуск без интернета.', error);
  });
}
</script>
</body></html>
